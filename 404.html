<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
<title>Page not found | Profiscience</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    color-scheme: light;
    --bg: #f7f4ee;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #5f666f;
    --accent: #0f6d6a;
    --border: #d9d2c7;
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at top left, rgba(15, 109, 106, 0.12), transparent 30%),
      radial-gradient(circle at top right, rgba(15, 109, 106, 0.08), transparent 22%),
      var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
  }

  main {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
  }

  .card {
    width: min(640px, 100%);
    padding: 32px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 20px 60px rgba(31, 35, 40, 0.08);
    backdrop-filter: blur(8px);
  }

  .eyebrow {
    margin: 0 0 12px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: "Space Grotesk", Inter, "Segoe UI", Arial, sans-serif;
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.03;
  }

  p {
    margin: 16px 0 0;
    font-size: 1.03rem;
    line-height: 1.6;
    color: var(--muted);
  }

  a {
    color: var(--accent);
  }

  .link-row {
    margin-top: 24px;
  }

  .link-row a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 18px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }
</style>
<script src="js/404-redirect.js"></script>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Profiscience</p>
      <h1 id="page-title">Page not found</h1>
      <p>This page is usually redirected automatically. If it does not move, use the home page to continue.</p>
      <div class="link-row">
        <a href="/">Go to home</a>
      </div>
    </section>
  </main>
</body>
</html>
