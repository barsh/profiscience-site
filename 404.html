<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page not found | Profiscience</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    color-scheme: light;
    --bg: #f7f4ee;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #5f666f;
    --accent: #0f6d6a;
    --border: #d9d2c7;
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at top left, rgba(15, 109, 106, 0.12), transparent 30%),
      radial-gradient(circle at top right, rgba(15, 109, 106, 0.08), transparent 22%),
      var(--bg);
    color: var(--text);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
  }

  main {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
  }

  .card {
    width: min(640px, 100%);
    padding: 32px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 20px 60px rgba(31, 35, 40, 0.08);
    backdrop-filter: blur(8px);
  }

  .eyebrow {
    margin: 0 0 12px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: "Space Grotesk", Inter, "Segoe UI", Arial, sans-serif;
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.03;
  }

  p {
    margin: 16px 0 0;
    font-size: 1.03rem;
    line-height: 1.6;
    color: var(--muted);
  }

  a {
    color: var(--accent);
  }

  .link-row {
    margin-top: 24px;
  }

  .link-row a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 18px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }
</style>
<script>
(function () {
  var path = window.location.pathname.replace(/\/+$/, '') || '/';

  var exactRedirects = {
    '/products.aspx': '/platform',
    '/about.aspx': '/about',
    '/contact.aspx': '/contact',
    '/request-demo.aspx': '/contact',
    '/testimonials.aspx': '/clients#what-clients-say',
    '/opt-in.aspx': '/stay-clever#the-cle-corner',
    '/opt-out.aspx': '/unsubscribe',
    '/UniversitySite-Public-API-Documentation': 'https://documenter.getpostman.com/view/3947254/SWTBfdW8'
  };

  var caseStudyRedirects = [
    { test: /^\/CaseStudies\/Bond.*\.pdf$/i, to: '/case-study-bond-schoeneck-king' },
    { test: /^\/CaseStudies\/Foley.*\.pdf$/i, to: '/case-study-foley-lardner' },
    { test: /^\/CaseStudies\/Haynes.*\.pdf$/i, to: '/case-study-haynes-boone-sdk' },
    { test: /^\/CaseStudies\/Steptoe.*\.pdf$/i, to: '/case-study-steptoe-johnson' },
    { test: /^\/CaseStudies\/Verrill.*\.pdf$/i, to: '/case-study-verrill' },
    { test: /^\/CaseStudies\/WBD.*\.pdf$/i, to: '/case-study-womble-bond-dickinson' },
    { test: /^\/CaseStudies\/.*\.pdf$/i, to: '/clients' }
  ];

  function go(target) {
    window.location.replace(target);
  }

  if (/^\/stay-clever-book(?:\/.*)?$/i.test(path)) {
    go('/stay-clever');
    return;
  }

  if (Object.prototype.hasOwnProperty.call(exactRedirects, path)) {
    go(exactRedirects[path]);
    return;
  }

  for (var index = 0; index < caseStudyRedirects.length; index += 1) {
    if (caseStudyRedirects[index].test.test(path)) {
      go(caseStudyRedirects[index].to);
      return;
    }
  }
}());
</script>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Profiscience</p>
      <h1 id="page-title">Page not found</h1>
      <p>This page is usually redirected automatically. If it does not move, use the home page to continue.</p>
      <div class="link-row">
        <a href="/">Go to home</a>
      </div>
    </section>
  </main>
</body>
</html>
