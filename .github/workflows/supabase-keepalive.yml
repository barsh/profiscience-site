# Keeps the free-tier Supabase project from pausing (it pauses after ~1 week
# of inactivity, which would break the resources page).
#
# This runs on GitHub's servers and hits the Supabase REST API directly, so it
# works regardless of where the website is hosted (GitHub Pages, profiscience.com,
# anywhere). It does NOT depend on the site being up.
#
# Two things happen each run:
#   1. Ping the database  -> registers activity so Supabase stays awake.
#   2. Self-heal          -> GitHub auto-disables scheduled workflows after 60
#      days with no repo commits. If the repo has been idle 45+ days, this makes
#      an empty commit so the workflow can never disable itself. Result: the
#      GitHub half of the keep-alive is self-sustaining with no babysitting.
#
# No secrets required: the key below is the PUBLIC publishable key (already in
# js/supabase-config.js; safe to expose - row-level security protects the data).
# Never put the service_role / secret key here.
#
# This is deliberately redundant with an external pinger (see
# docs/keep-supabase-alive.md). Either mechanism alone keeps the project live.

name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # run on demand from the Actions tab

permissions:
  contents: write # needed for the self-heal commit

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SUPABASE_URL: "https://rqkbjvyxhdknbjhaszya.supabase.co"
          SUPABASE_KEY: "sb_publishable_Y-lJeRmMpUi3Xd13_psUtg_GHpjkDWf"
        run: |
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/articles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP $status"
          cat /tmp/body.txt

          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP $status"
            exit 1
          fi
          echo "Project is awake."

      - name: Prevent 60-day auto-disable
        if: always() # run even if the ping failed, so the workflow stays enabled
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Most recent commit was $days day(s) ago."
          if [ "$days" -ge 45 ]; then
            echo "Repo idle 45+ days - making an empty commit to stay enabled."
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive heartbeat [skip ci]"
            git push
          else
            echo "Recent activity exists - no keep-alive commit needed."
          fi
