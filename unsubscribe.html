<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh https://sc.lfeeder.com https://rest.happierleads.com https://webforms.pipedrive.com https://cdn.cmh-1.pipedriveassets.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://rqkbjvyxhdknbjhaszya.supabase.co https://sc.lfeeder.com https://rest.happierleads.com https://session-recordings.happierleads.com https://page-visits-full.pagemetry.com https://webforms.pipedrive.com; frame-src https://webforms.pipedrive.com; object-src 'none'; base-uri 'self'; form-action 'self' https://webforms.pipedrive.com" />
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
<title>Unsubscribe — The CLE Corner | Profiscience</title>
<meta name="description" content="Unsubscribe from The CLE Corner newsletter." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="assets/favicon.ico" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">The CLE Corner</span>
    <h1>Unsubscribe</h1>
    <p>Sorry to see you go. Enter your email below to stop receiving The CLE Corner newsletter.</p>
  </div>
</section>

<section>
  <div class="container" style="max-width:520px; margin:0 auto;">
    <div class="unsub-card reveal">
      <form id="unsubForm">
        <div class="form-group">
          <label for="unsub-email">Email address</label>
          <input id="unsub-email" type="email" required placeholder="you@firm.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-arrow" id="unsubBtn" style="width:100%; justify-content:center">Unsubscribe</button>
        <div class="form-error" id="unsubError" style="display:none; color:#DC2626; margin-top:12px; font-weight:600"></div>
      </form>
      <div class="form-success" id="unsubSuccess" style="display:none; color:var(--pf-success); font-weight:600; font-size:1.05rem">
        ✓ You've been unsubscribed. You won't receive further CLE Corner emails.
      </div>
      <p class="unsub-note">Changed your mind? <a href="stay-clever#the-cle-corner">Re-subscribe here</a>.</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/chat.js" defer></script>

<script src="js/unsubscribe-prefill.js"></script>
<script type="module" src="js/unsubscribe.js"></script>

<style>
  .unsub-card {
    background: white;
    border: 1px solid var(--pf-line);
    border-radius: var(--r-lg);
    padding: 32px;
    box-shadow: var(--sh-sm);
  }
  .unsub-card .form-group { margin-bottom: 16px; }
  .unsub-card label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
  .unsub-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--pf-line);
    border-radius: var(--r-sm);
    font: inherit; font-size: .95rem;
    box-sizing: border-box;
  }
  .unsub-card input:focus { outline: none; border-color: var(--pf-blue); box-shadow: 0 0 0 3px rgba(20,99,255,.15); }
  .unsub-note { margin: 18px 0 0; font-size: .88rem; color: var(--pf-mute); }
</style>
</body>
</html>
