<title>Profiscience</title>
<meta name="description" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="assets/favicon.ico" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <a href="resources" class="cs-back">&larr; All resources</a>
    <span class="eyebrow" id="postEyebrow">Resources</span>
    <h1 id="postTitle">Loading…</h1>
    <p id="postExcerpt"></p>
    <p class="post-byline" id="postByline" style="color:rgba(255,255,255,.6); font-size:.9rem;"></p>
  </div>
</section>

<section>
  <div class="container">
    <article class="cs-prose post-body" id="postBody" style="max-width:760px; margin:0 auto;">
      <!-- rendered from the database -->
    </article>
    <p id="postError" style="display:none; text-align:center; color:var(--pf-mute); padding:40px 0;"></p>
  </div>
</section>

<section class="cta-band">
  <div class="container">
    <div class="reveal">
      <h2>Want to see the platform?</h2>
      <p>A short discovery call is the fastest way to know if we're a fit.</p>
      <div class="btns">
        <a href="contact" class="btn btn-primary btn-arrow" data-cta="post_demo">Let's Talk</a>
        <a href="resources" class="btn btn-secondary">More resources</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/main.js"></script>
<script src="js/chat.js" defer></script>
<script type="module" src="js/post.js"></script>
</body>
</html>
